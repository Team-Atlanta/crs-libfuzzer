name: crs-libfuzzer
type:
  - bug-finding
version: 1.0.0
docker_registry: ghcr.io/team-atlanta/test-local

prepare_phase:
  hcl: oss-crs/docker-bake.hcl

target_build_phase:
  - name: build
    dockerfile: oss-crs/dockerfiles/builder.Dockerfile

crs_run_phase:
  fuzzer:
    dockerfile: oss-crs/dockerfiles/runner.Dockerfile

supported_target:
  mode:
    - full
    - delta
  language:
    - c
    - jvm
  sanitizer:
    - address
  architecture:
    - x86_64

required_llms:
  - claude-opus-4-5-20251101
