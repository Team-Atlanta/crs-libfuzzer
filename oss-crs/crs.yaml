name: crs-libfuzzer
type:
- bug-finding
version: 1.0.0
docker_registry: ghcr.io/team-atlanta/crs-libfuzzer
target_build_phase:
- name: build
  dockerfile: oss-crs/dockerfiles/builder.Dockerfile
  outputs:
  - build
crs_run_phase:
  fuzzer:
    dockerfile: oss-crs/dockerfiles/runner.Dockerfile
    target_dependent: false
supported_target:
  mode:
  - full
  - delta
  language:
  - c
  sanitizer:
  - address
  architecture:
  - x86_64
